<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>-</title></head><body><script>
(async()=>{const f=new URLSearchParams(location.search).get('f')||'';if(!/^[\w.-]+$/.test(f))return;
const r=await fetch('./'+f,{cache:'no-store'});const b=await r.blob();
parent.postMessage({glowMedia:true,name:f,type:b.type,blob:b},'*');})();
</script></body></html>
